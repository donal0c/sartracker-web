name: Electron Linux Validation Build

# Builds the Electron validation app on Linux so native modules are produced by
# a Linux toolchain instead of macOS cross-builds. This is the DON-57 path for
# generating AppImage/.deb artifacts before wider tester handoff.

on:
  workflow_dispatch:
    inputs:
      run_repair_train_d_smoke:
        description: 'Run strict Train D packaged proof after baseline diagnostic blockers are repaired'
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - '.github/workflows/electron-linux-validation.yml'
      - '.github/workflows/electron-release.yml'
      - 'electron/**'
      - 'docs/**'
      - 'handoff/**'
      - 'public/manual/**'
      - 'shared/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.json'
      - 'vite.config.ts'
      - 'playwright*.config.ts'
      - 'vitest*.config.ts'
      - 'tsconfig*.json'
      - 'build/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/electron-linux-validation.yml'
      - '.github/workflows/electron-release.yml'
      - 'electron/**'
      - 'docs/**'
      - 'handoff/**'
      - 'public/manual/**'
      - 'shared/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.json'
      - 'vite.config.ts'
      - 'playwright*.config.ts'
      - 'vitest*.config.ts'
      - 'tsconfig*.json'
      - 'build/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: electron-linux-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  correctness:
    name: Correctness and browser regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Bind exact source head and tree
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          SOURCE_DIRTY="$(git status --porcelain --untracked-files=all)"
          if [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out source head does not match EXPECTED_SOURCE_SHA."
            exit 1
          fi
          if [ -n "$SOURCE_DIRTY" ]; then
            echo "::error::Checked-out source tree is not clean."
            exit 1
          fi
          echo "EXPECTED_SOURCE_TREE=$SOURCE_TREE_SHA" >> "$GITHUB_ENV"
          mkdir -p tmp/electron-validation-evidence
          export ACTUAL_SOURCE_SHA SOURCE_TREE_SHA
          node --input-type=module <<'NODE' \
            > tmp/electron-validation-evidence/source-binding.json
          const binding = {
            schema: 'sartracker-electron-linux-source-binding-v1',
            repositoryHead: process.env.ACTUAL_SOURCE_SHA,
            repositoryTree: process.env.SOURCE_TREE_SHA,
            repositoryDirty: false,
          }
          process.stdout.write(`${JSON.stringify(binding, null, 2)}\n`)
          NODE

      - name: Verify complete legacy recovery evidence manifest
        run: node scripts/verify-legacy-recovery-evidence.mjs

      - name: Install Linux Electron runtime deps
        run: |
          # These packages come from Ubuntu, not runner-added Chrome or
          # Microsoft feeds. Keep their index failures out of this install.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y \
            dbus-x11 \
            gnome-keyring \
            imagemagick \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libfuse2 \
            libgbm1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            squashfs-tools \
            openbox \
            python3 \
            libgtk-3-0 \
            libnss3 \
            libxdamage1 \
            libxkbcommon0 \
            libxrandr2 \
            libxss1 \
            xdotool \
            x11-utils \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Full correctness unit gate
        # Mixed fixtures retain their workloads and correctness assertions.
        # Strict wall-clock qualification is a separate mandatory release gate.
        run: npm run test:correctness -- --no-file-parallelism

      - name: WAR-02B bounded property and mutation gate
        run: npm run test:war-02b

      - name: WAR-02B controlled rebreak proof
        run: npm run assurance:war-02b

      - name: Strict responsiveness qualification (<200 ms)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run test:responsiveness

      - name: Record PR qualification boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo 'PR correctness/build/launch evidence only; release HOLD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Whole-candidate strict <200 ms source and packaged timing qualification is not run for PR merge. The bounded breadcrumb transport smoke is a targeted causal check only. Full qualification remains mandatory before beta/release, with every retained failure unresolved until repaired and qualified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Electron responsiveness attribution controls
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            npx playwright test --project=electron-controls --workers=1

      - name: Production web build and bundle budgets
        run: |
          set -euo pipefail
          npm run build
          # The package command captures its own clean pre-build source state.
          # Remove only this preceding build's generated metadata, never other edits.
          git diff --exit-code -- . ':!src/lib/version.generated.ts'
          git diff --cached --exit-code
          git restore --source=HEAD --worktree -- src/lib/version.generated.ts
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: WAR-06 rendered mission boundary regressions
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.war06.config.ts --project=chromium --workers=1

      - name: WAR-11 rendered offline map freshness regressions
        run: |
          set -euo pipefail
          mkdir -p tmp/electron-validation-evidence/war11-browser
          npx playwright test --config playwright.war11.config.ts --project=chromium --workers=1 2>&1 \
            | tee tmp/electron-validation-evidence/war11-browser/playwright.log

      - name: Train C rendered map interaction regressions
        run: |
          set -euo pipefail
          mkdir -p tmp/electron-validation-evidence/train-c
          npx playwright test --config playwright.train-c.config.ts --project=chromium --workers=1 2>&1 \
            | tee tmp/electron-validation-evidence/train-c/playwright.log

      - name: Coverage partial and recovery browser regressions
        run: |
          set -euo pipefail
          mkdir -p tmp/electron-validation-evidence/native-coverage-browser
          npx playwright test tests/e2e/coverage.spec.ts --project=chromium --workers=1 2>&1 \
            | tee tmp/electron-validation-evidence/native-coverage-browser/playwright.log
          cp tmp/native-runtime-repair/claude-coverage-partial.png \
            tmp/native-runtime-repair/claude-coverage-recovered.png \
            tmp/electron-validation-evidence/native-coverage-browser/

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-correctness-evidence-${{ env.EXPECTED_SOURCE_SHA }}-attempt-${{ github.run_attempt }}
          path: |
            tmp/electron-validation-evidence
            tmp/electron-validation-evidence/repair-train-d/receipt.json
            test-results/war06-mission-scope
            test-results/war11-map-freshness
            test-results/train-c
            tmp/war-11/browser-view-checked.png
            tmp/war-11/browser-package-removed.png
            tmp/war-11/browser-negative-result-retained.png
            tmp/beta-artifacts/tracking-soak-ci
            tmp/breadcrumb-pr5-evidence
            tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-report.json
            tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-failure.json
          if-no-files-found: warn

  package:
    name: Build exact Linux package
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.package_transfer.outputs.sha256 }}
      source: ${{ steps.package_transfer.outputs.source }}
      artifact: ${{ steps.package_transfer.outputs.artifact }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Bind exact source head and tree
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          SOURCE_DIRTY="$(git status --porcelain --untracked-files=all)"
          if [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out source head does not match EXPECTED_SOURCE_SHA."
            exit 1
          fi
          if [ -n "$SOURCE_DIRTY" ]; then
            echo "::error::Checked-out source tree is not clean."
            exit 1
          fi
          echo "EXPECTED_SOURCE_TREE=$SOURCE_TREE_SHA" >> "$GITHUB_ENV"
          mkdir -p tmp/electron-validation-evidence
          export ACTUAL_SOURCE_SHA SOURCE_TREE_SHA
          node --input-type=module <<'NODE' \
            > tmp/electron-validation-evidence/source-binding.json
          const binding = {
            schema: 'sartracker-electron-linux-source-binding-v1',
            repositoryHead: process.env.ACTUAL_SOURCE_SHA,
            repositoryTree: process.env.SOURCE_TREE_SHA,
            repositoryDirty: false,
          }
          process.stdout.write(`${JSON.stringify(binding, null, 2)}\n`)
          NODE

      - name: Verify complete legacy recovery evidence manifest
        run: node scripts/verify-legacy-recovery-evidence.mjs

      - name: Install Linux Electron runtime deps
        run: |
          # These packages come from Ubuntu, not runner-added Chrome or
          # Microsoft feeds. Keep their index failures out of this install.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y \
            dbus-x11 \
            gnome-keyring \
            imagemagick \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libfuse2 \
            libgbm1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            squashfs-tools \
            openbox \
            python3 \
            libgtk-3-0 \
            libnss3 \
            libxdamage1 \
            libxkbcommon0 \
            libxrandr2 \
            libxss1 \
            xdotool \
            x11-utils \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build Electron Linux artifacts
        # This workflow is an internal qualification lane. Release packaging
        # deliberately omits this flag until the programme's final gate.
        env:
          VITE_SARTRACKER_MISSION_MODEL: '1'
        run: |
          mkdir -p tmp/electron-validation-evidence
          npm run electron:dist:linux

      - name: Restore exact source tree after packaging
        run: |
          set -euo pipefail
          TRACKED_STATUS="$(git status --porcelain --untracked-files=no)"
          if [ -n "$TRACKED_STATUS" ] \
            && [ "$TRACKED_STATUS" != " M src/lib/version.generated.ts" ]; then
            echo "::error::Unexpected tracked changes were created while packaging."
            git status --short --untracked-files=no
            exit 1
          fi
          git restore --source=HEAD --worktree -- src/lib/version.generated.ts
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Exact source tree was not clean after restoring generated version metadata."
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Inspect artifacts and native SQLite module
        id: inspect_linux_artifacts
        run: |
          set -euo pipefail
          mkdir -p tmp/electron-validation-evidence

          APPIMAGE="$(find tmp/electron-dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          DEB="$(find tmp/electron-dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          NATIVE_MODULE="$(find tmp/electron-dist/linux-unpacked -type f -name 'better_sqlite3.node' -print -quit)"

          if [ -z "$APPIMAGE" ]; then
            echo "::error::Electron AppImage was not produced."
            exit 1
          fi
          if [ -z "$DEB" ]; then
            echo "::error::Electron .deb was not produced."
            exit 1
          fi
          if [ -z "$NATIVE_MODULE" ]; then
            echo "::error::Packaged better_sqlite3.node was not found in linux-unpacked."
            exit 1
          fi

          file "$NATIVE_MODULE" | tee tmp/electron-validation-evidence/better-sqlite3-file.txt
          grep -E 'ELF 64-bit LSB shared object, x86-64' \
            tmp/electron-validation-evidence/better-sqlite3-file.txt

          sha256sum "$APPIMAGE" "$DEB" > tmp/electron-dist/SHA256SUMS
          cp tmp/electron-dist/SHA256SUMS tmp/electron-validation-evidence/SHA256SUMS
          {
            stat --printf='%n %s bytes\n' "$APPIMAGE"
            stat --printf='%n %s bytes\n' "$DEB"
          } | tee tmp/electron-validation-evidence/artifacts.txt

      - name: Preserve exact package for independent checks
        id: package_transfer
        run: |
          set -euo pipefail
          tar -czf tmp/validation-package.tar.gz -C tmp electron-dist
          {
            echo "sha256=$(sha256sum tmp/validation-package.tar.gz | cut -d ' ' -f1)"
            echo "source=$EXPECTED_SOURCE_SHA"
            echo "artifact=validation-package-$EXPECTED_SOURCE_SHA-attempt-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact package transfer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_transfer.outputs.artifact }}
          path: tmp/validation-package.tar.gz
          if-no-files-found: error

      - name: Upload Electron Linux artifacts
        if: ${{ always() && steps.inspect_linux_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-artifacts-${{ env.EXPECTED_SOURCE_SHA }}-attempt-${{ github.run_attempt }}
          path: |
            tmp/electron-dist/*.AppImage
            tmp/electron-dist/*.deb
            tmp/electron-dist/SHA256SUMS
          if-no-files-found: error

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-evidence-${{ env.EXPECTED_SOURCE_SHA }}-attempt-${{ github.run_attempt }}
          path: |
            tmp/electron-validation-evidence
            tmp/electron-validation-evidence/repair-train-d/receipt.json
            test-results/war06-mission-scope
            test-results/war11-map-freshness
            test-results/train-c
            tmp/war-11/browser-view-checked.png
            tmp/war-11/browser-package-removed.png
            tmp/war-11/browser-negative-result-retained.png
            tmp/beta-artifacts/tracking-soak-ci
            tmp/breadcrumb-pr5-evidence
            tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-report.json
            tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-failure.json
          if-no-files-found: warn

  build:
    name: Packaged Linux checks
    needs: [package]
    runs-on: ubuntu-22.04
    timeout-minutes: 160
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Bind exact source head and tree
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          SOURCE_DIRTY="$(git status --porcelain --untracked-files=all)"
          if [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out source head does not match EXPECTED_SOURCE_SHA."
            exit 1
          fi
          if [ -n "$SOURCE_DIRTY" ]; then
            echo "::error::Checked-out source tree is not clean."
            exit 1
          fi
          echo "EXPECTED_SOURCE_TREE=$SOURCE_TREE_SHA" >> "$GITHUB_ENV"
          mkdir -p tmp/electron-validation-evidence
          export ACTUAL_SOURCE_SHA SOURCE_TREE_SHA
          node --input-type=module <<'NODE' \
            > tmp/electron-validation-evidence/source-binding.json
          const binding = {
            schema: 'sartracker-electron-linux-source-binding-v1',
            repositoryHead: process.env.ACTUAL_SOURCE_SHA,
            repositoryTree: process.env.SOURCE_TREE_SHA,
            repositoryDirty: false,
          }
          process.stdout.write(`${JSON.stringify(binding, null, 2)}\n`)
          NODE

      - name: Verify complete legacy recovery evidence manifest
        run: node scripts/verify-legacy-recovery-evidence.mjs

      - name: Install Linux Electron runtime deps
        run: |
          # These packages come from Ubuntu, not runner-added Chrome or
          # Microsoft feeds. Keep their index failures out of this install.
          test -s /etc/apt/sources.list
          sudo apt-get -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourceparts=- install -y \
            dbus-x11 \
            gnome-keyring \
            imagemagick \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libfuse2 \
            libgbm1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            mesa-utils \
            squashfs-tools \
            openbox \
            python3 \
            libgtk-3-0 \
            libnss3 \
            libxdamage1 \
            libxkbcommon0 \
            libxrandr2 \
            libxss1 \
            xdotool \
            x11-utils \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Download exact package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: tmp/package-transfer

      - name: Verify and restore exact package
        env:
          TRANSFER_SHA256: ${{ needs.package.outputs.sha256 }}
          TRANSFER_SOURCE: ${{ needs.package.outputs.source }}
        run: |
          set -euo pipefail
          test "$TRANSFER_SOURCE" = "$EXPECTED_SOURCE_SHA"
          test -n "$TRANSFER_SHA256"
          echo "$TRANSFER_SHA256  tmp/package-transfer/validation-package.tar.gz" | sha256sum -c -
          tar -xzf tmp/package-transfer/validation-package.tar.gz -C tmp
          sha256sum -c tmp/electron-dist/SHA256SUMS
          test -x tmp/electron-dist/linux-unpacked/sartracker-web

      - name: Qualify mission evidence replay at the normal 960k envelope
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run breadcrumb-pr5:qualify -- --preset=bcp-960k

      - name: Attest Mesa llvmpipe renderer
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            glxinfo -B | tee tmp/electron-validation-evidence/glxinfo.txt
          grep -qi 'llvmpipe' tmp/electron-validation-evidence/glxinfo.txt

      # 81 minutes of declared case bounds, 4.5 minutes of owned cleanup,
      # and evidence/summary headroom. These are harness deadlines, not
      # responsiveness or qualification thresholds.
      - name: Candidate producer development checks (not qualification)
        timeout-minutes: 100
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/qualification/producer-development-checks.mjs \
              "$GITHUB_WORKSPACE/tmp/electron-dist/linux-unpacked/sartracker-web" \
              "$GITHUB_WORKSPACE/tmp/electron-validation-evidence/candidate-producer-development" \
              "$EXPECTED_SOURCE_SHA"

      - name: Exact-head packaged C17 support-export privacy proof (not qualification)
        timeout-minutes: 20
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          C17_EVIDENCE="$GITHUB_WORKSPACE/tmp/electron-validation-evidence/c17-packaged-support-export"
          mkdir -p "$C17_EVIDENCE"
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/qualification/composite-probe.mjs \
              --app "$GITHUB_WORKSPACE/tmp/electron-dist/linux-unpacked/sartracker-web" \
              --evidence "$C17_EVIDENCE" \
              --expected-head "$EXPECTED_SOURCE_SHA" \
              --variant routine \
              --family-contract C17
          node scripts/qualification/verify-c17-packaged-support-export.mjs \
            --app "$GITHUB_WORKSPACE/tmp/electron-dist/linux-unpacked/sartracker-web" \
            --evidence "$C17_EVIDENCE" \
            --expected-head "$EXPECTED_SOURCE_SHA"

      - name: Packaged native coverage runtime control
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/electron-native-runtime-smoke.mjs \
              tmp/electron-dist/linux-unpacked/sartracker-web \
              tmp/electron-validation-evidence/native-runtime

      - name: Packaged official map qualification and freshness smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            npm run electron:smoke:official-map-qualification -- \
              --app tmp/electron-dist/linux-unpacked/sartracker-web \
              --evidence-dir tmp/electron-validation-evidence/official-map-qualification

      - name: Packaged GPX fidelity and custody smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
          SARTRACKER_ELECTRON_REQUIRE_LINUX_UNPACKED: '1'
        run: |
          set -euo pipefail
          PACKAGE="tmp/electron-dist/linux-unpacked/sartracker-web"
          if [ ! -x "$PACKAGE" ]; then
            echo "::error::The unpacked Linux Electron executable was not found."
            exit 1
          fi
          mkdir -p tmp/electron-validation-evidence/gpx-fidelity-smoke
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            npm run electron:smoke:gpx-fidelity -- "$PACKAGE" \
              tmp/electron-validation-evidence/gpx-fidelity-smoke

      - name: Packaged bounded breadcrumb transport causal proof
        env:
          SARTRACKER_ELECTRON_REQUIRE_LINUX_UNPACKED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/electron-breadcrumb-transport-smoke.mjs \
              tmp/electron-dist/linux-unpacked/sartracker-web \
              tmp/electron-validation-evidence/breadcrumb-transport

      - name: Packaged WAR-06 mission cache restart proof
        env:
          SARTRACKER_ELECTRON_REQUIRE_LINUX_UNPACKED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/electron-war06-mission-cache-smoke.mjs \
              --app tmp/electron-dist/linux-unpacked/sartracker-web \
              --evidence tmp/electron-validation-evidence/war06-mission-cache

      - name: Packaged participant progress and Search Operations backup proof
        if: github.event_name == 'workflow_dispatch' && inputs.run_repair_train_d_smoke == true
        timeout-minutes: 5
        env:
          SARTRACKER_ELECTRON_REQUIRE_LINUX_UNPACKED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/electron-repair-train-d-smoke.mjs \
              --app tmp/electron-dist/linux-unpacked/sartracker-web \
              --evidence tmp/electron-validation-evidence/repair-train-d

      - name: Independently validate Repair Train D packaged receipt
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_repair_train_d_smoke == true
        timeout-minutes: 1
        env:
          SARTRACKER_ELECTRON_REQUIRE_LINUX_UNPACKED: '1'
        run: |
          set -euo pipefail
          node scripts/validate-electron-repair-train-d-smoke.mjs \
            --receipt tmp/electron-validation-evidence/repair-train-d/receipt.json

      - name: Record deferred Repair Train D packaged qualification
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.run_repair_train_d_smoke == true)
        run: |
          set -euo pipefail
          node scripts/record-electron-repair-train-d-deferred.mjs \
            --output tmp/electron-validation-evidence/repair-train-d/receipt.json
          echo 'Repair Train D packaged smoke: NOT RUN. Known baseline diagnostic blockers remain open under DON-254; skipped qualification is not a pass. Release remains HOLD.' >> "$GITHUB_STEP_SUMMARY"

      - name: Packaged legacy object recovery observer proof
        id: legacy_recovery_smoke
        timeout-minutes: 5
        env:
          SARTRACKER_ELECTRON_REQUIRE_LINUX_UNPACKED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          NO_AT_BRIDGE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            dbus-run-session -- \
            node scripts/electron-legacy-object-recovery-smoke.mjs \
              tmp/electron-dist/linux-unpacked/sartracker-web \
              tmp/electron-validation-evidence/legacy-object-recovery

      - name: Verify legacy recovery terminal report
        if: ${{ always() && steps.legacy_recovery_smoke.outcome != 'skipped' }}
        run: node scripts/verify-legacy-recovery-report.mjs tmp/electron-validation-evidence/legacy-object-recovery/report.json

      - name: Packaged tracking soak (CI profile)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            npm run electron:smoke:tracking-soak:ci

      - name: Packaged archive lifecycle smoke
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: archive_lifecycle_smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          # Keep the optional Chrome profiler out of the normal timing lane.
          # The independent current/main/frame watchdogs remain mandatory.
        run: |
          set -euo pipefail
          lscpu --json > tmp/electron-validation-evidence/cpu-topology.json
          dpkg-query -W libgl1-mesa-dri libglx-mesa0 xvfb \
            > tmp/electron-validation-evidence/graphics-package-versions.txt
          xvfb-run -a --server-args='-screen 0 1440x900x24' \
            npm run electron:smoke:archive-lifecycle:ci

      - name: Verify archive lifecycle terminal evidence
        if: ${{ always() && steps.archive_lifecycle_smoke.outcome != 'skipped' }}
        run: |
          node --input-type=module <<'NODE'
          import { lstat, readFile } from 'node:fs/promises'

          const candidates = [
            {
              path: 'tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-report.json',
              passed: true,
            },
            {
              path: 'tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-failure.json',
              passed: false,
            },
          ]
          const terminalArtifacts = []
          for (const candidate of candidates) {
            try {
              terminalArtifacts.push({ ...candidate, identity: await lstat(candidate.path) })
            } catch (error) {
              if (error?.code !== 'ENOENT') throw error
            }
          }
          if (terminalArtifacts.length !== 1) {
            throw new Error('Archive lifecycle must publish exactly one terminal evidence artifact.')
          }
          const [terminal] = terminalArtifacts
          if (!terminal.identity.isFile() || terminal.identity.isSymbolicLink()
            || terminal.identity.size < 1 || terminal.identity.size > 4 * 1024 * 1024
            || (terminal.identity.mode & 0o777) !== 0o600) {
            throw new Error('Archive lifecycle terminal evidence identity is unsafe or unbounded.')
          }
          const evidence = JSON.parse(await readFile(terminal.path, 'utf8'))
          if (evidence?.verdict?.passed !== terminal.passed) {
            throw new Error('Archive lifecycle terminal evidence verdict does not match its filename.')
          }
          console.log(`archive-lifecycle-terminal-evidence=${terminal.path}`)
          NODE

      - name: Launch AppImage smoke
        run: |
          set -euo pipefail
          APPIMAGE="$(find tmp/electron-dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          chmod +x "$APPIMAGE"
          export APPIMAGE

          xvfb-run -a --server-args='-screen 0 1440x900x24' dbus-run-session -- bash <<'EOF'
          set -euo pipefail
          export NO_AT_BRIDGE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe

          openbox --sm-disable \
            > tmp/electron-validation-evidence/openbox.log \
            2>&1 &
          WM_PID=$!
          trap 'kill "$WM_PID" 2>/dev/null || true; wait "$WM_PID" 2>/dev/null || true' EXIT
          WM_FOUND=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$WM_PID" 2>/dev/null; then
              echo "::error::Openbox exited before it could manage the X11 session."
              cat tmp/electron-validation-evidence/openbox.log || true
              exit 1
            fi
            if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null \
              | tee tmp/electron-validation-evidence/window-manager.txt \
              | grep -Eq '_NET_SUPPORTING_WM_CHECK\(WINDOW\): window id # 0x[0-9a-f]+'; then
              WM_FOUND=1
              break
            fi
            sleep 1
          done
          if [ "$WM_FOUND" != "1" ]; then
            echo "::error::The X11 window manager did not become ready."
            cat tmp/electron-validation-evidence/openbox.log || true
            exit 1
          fi

          printf '\n' | gnome-keyring-daemon --unlock --components=secrets \
            > tmp/electron-validation-evidence/keyring-env.txt \
            2> tmp/electron-validation-evidence/keyring.log || true
          if [ -s tmp/electron-validation-evidence/keyring-env.txt ]; then
            set -a
            # shellcheck disable=SC1091
            . tmp/electron-validation-evidence/keyring-env.txt
            set +a
          fi

          "$APPIMAGE" \
            --no-sandbox \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=gl \
            --disable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE \
            > tmp/electron-validation-evidence/appimage.log \
            2>&1 &
          APP_PID=$!
          echo "$APP_PID" > tmp/electron-validation-evidence/appimage.pid

          WINDOW_FOUND=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::AppImage exited before a window appeared."
              cat tmp/electron-validation-evidence/appimage.log || true
              exit 1
            fi
            if xdotool search --name 'SAR Tracker Web' \
              > tmp/electron-validation-evidence/window-ids.txt 2>/dev/null; then
              WINDOW_FOUND=1
              break
            fi
            sleep 1
          done

          if [ "$WINDOW_FOUND" != "1" ]; then
            echo "::error::SAR Tracker Web window did not appear."
            cat tmp/electron-validation-evidence/appimage.log || true
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi

          sleep 5
          import -window root tmp/electron-validation-evidence/appimage-launch.png
          test -s tmp/electron-validation-evidence/appimage-launch.png
          convert tmp/electron-validation-evidence/appimage-launch.png \
            -crop 1440x820+0+60 \
            tmp/electron-validation-evidence/appimage-content.png
          CONTENT_MEAN="$(convert tmp/electron-validation-evidence/appimage-content.png \
            -colorspace Gray \
            -format '%[fx:mean]' \
            info:)"
          echo "$CONTENT_MEAN" > tmp/electron-validation-evidence/appimage-content-mean.txt
          awk -v mean="$CONTENT_MEAN" 'BEGIN { exit !(mean > 0.05) }' || {
            echo "::error::AppImage content region is too dark; the packaged app may have opened a black window."
            echo "Content grayscale mean: $CONTENT_MEAN"
            cat tmp/electron-validation-evidence/appimage.log || true
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          }

          WINDOW_ID="$(head -n 1 tmp/electron-validation-evidence/window-ids.txt)"
          FRAME_ID="$(xwininfo -tree -id "$WINDOW_ID" \
            | awk '/Parent window id:/ { print $4; exit }')"
          if [ -z "$FRAME_ID" ]; then
            echo "::error::Openbox frame for the SAR Tracker window was not found."
            exit 1
          fi
          eval "$(xdotool getwindowgeometry --shell "$FRAME_ID")"
          CLOSE_X=$((X + WIDTH - 12))
          CLOSE_Y=$((Y + 10))
          echo "window=$WINDOW_ID frame=$FRAME_ID close=$CLOSE_X,$CLOSE_Y" \
            > tmp/electron-validation-evidence/appimage-close-click.txt
          xdotool mousemove --sync "$CLOSE_X" "$CLOSE_Y" click 1
          APP_EXITED=0
          for _ in $(seq 1 150); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              APP_EXITED=1
              break
            fi
            APP_STATE="$(ps -o stat= -p "$APP_PID" 2>/dev/null || true)"
            if [[ "$APP_STATE" == Z* ]]; then
              APP_EXITED=1
              break
            fi
            sleep 0.1
          done
          if [ "$APP_EXITED" != "1" ]; then
            echo "::error::AppImage did not exit after the packaged window close request."
            cat tmp/electron-validation-evidence/appimage.log || true
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          if ! wait "$APP_PID"; then
            echo "::error::AppImage exited unsuccessfully after its window close request."
            cat tmp/electron-validation-evidence/appimage.log || true
            exit 1
          fi
          echo "graceful-window-close=passed" \
            > tmp/electron-validation-evidence/appimage-graceful-close.txt
          kill "$WM_PID" 2>/dev/null || true
          wait "$WM_PID" 2>/dev/null || true
          trap - EXIT
          EOF

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-validation-evidence-${{ env.EXPECTED_SOURCE_SHA }}-attempt-${{ github.run_attempt }}
          path: |
            tmp/electron-validation-evidence
            tmp/electron-validation-evidence/repair-train-d/receipt.json
            test-results/war06-mission-scope
            test-results/war11-map-freshness
            test-results/train-c
            tmp/war-11/browser-view-checked.png
            tmp/war-11/browser-package-removed.png
            tmp/war-11/browser-negative-result-retained.png
            tmp/beta-artifacts/tracking-soak-ci
            tmp/breadcrumb-pr5-evidence
            tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-report.json
            tmp/breadcrumb-pr6-packaged-archive-smoke/electron-archive-lifecycle-smoke-failure.json
          if-no-files-found: warn

  required:
    name: Build and inspect Linux Electron artifacts
    if: ${{ always() }}
    needs: [correctness, package, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        env:
          CORRECTNESS: ${{ needs.correctness.result }}
          PACKAGE: ${{ needs.package.result }}
          PACKAGED: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          for result in "$CORRECTNESS" "$PACKAGE" "$PACKAGED"; do
            if [[ "$result" != success ]]; then
              echo "::error::Required validation lane failed, skipped or cancelled: $result"
              exit 1
            fi
          done
