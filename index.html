<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Theme before first paint (DON-344); mirrors src/lib/theme-preference.ts. */
      (function () {
        var root = document.documentElement
        var theme = 'light'
        try { if (window.localStorage.getItem('sartracker:high-contrast') === 'false') theme = 'standard' } catch (error) {
          root.dataset.themeReadFailed = 'true'
          console.error('SAR Tracker could not read the saved theme; using the default Light theme.', error)
        }
        root.dataset.theme = theme
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SAR Tracker Web mission management and live rescue team tracking for Mountain Rescue teams."
    />
    <title>SAR Tracker Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
